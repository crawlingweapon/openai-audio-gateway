name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -timeout 120s ./...
      - name: Build
        run: go build ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-X github.com/crawlingweapon/openai-audio-gateway/server.Version=${VERSION}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/audio-gateway_${VERSION}_${os}_${arch}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "$LDFLAGS" -o "$out" .
            if [ "$os" = "linux" ]; then gzip -f "$out"; else tar -C dist -czf "$out.tar.gz" "$(basename "$out")"; rm -f "$out"; fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
